commands:
- mcp
dependencies:
- networkx
- numpy
- litellm
- dill
- groq
- pypdf2
- nest-asyncio
- pyvis
- mcp
- tenacity
- html2text
- chardet
- faiss-cpu
- playwright
description: ISAA agent system — LLM integration, coding agents, MCP server, ContainerManager
enabled: true
files:
- mods/isaa/*
- mcp_server/*
- mods/ContainerManager/*
- utils/clis/tcm_p2p_cli.py
- flows/isaa/*
immutable: false
imports: []
name: isaa
requires:
- core
version: "0.1.29"
user_facing:
- name: isaa
  function: ui
  label: ISAA
  icon: smart_toy
  description: Agent chat, workspace & tools — startet erst beim Öffnen
  mount:
    module: toolboxv2.mods.isaa.ui.app
    attr: app
    prefix: isaa

- name: obs
  function: ui
  label: OBS
  icon: monitoring
  description: Live-Beobachtung der Agenten
  mount:
    module: toolboxv2.mods.isaa.extras.live_obs_server
    attr: app
    prefix: obs
