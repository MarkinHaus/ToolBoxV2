name: Release

# ============================================================================
# TRIGGER
#   - Tag-Push v*            -> Release-Build (Assets am Tag-Release)
#   - Tag mit "app" im Namen -> zusaetzlich Tauri/Android/iOS (z.B. v0.1.28-app)
#   - Tag mit "tbx" im Namen -> zusaetzlich TBLang-Compiler (z.B. v0.1.28-tbx)
#   - Jeder Tag ausserdem:   -> Frontend, Browser-Ext, Wheel, Installer, Docker
#   - Push auf master        -> Nur Kern-Binaries als Nightly-Prerelease
#   PyPI-Publish bewusst NICHT hier (separater Workflow, 0.1.27 live).
# ============================================================================

on:
  push:
    tags:
      - v*
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "lts/*"

jobs:
  # ============================================================================
  # KERN (immer): 3 Nuitka-Onefile-Binaries, installer.sh-Schema
  # ============================================================================

  # Linux onefile — GLIBC 2.31 Target (Ubuntu 20.04), laeuft auf allen aelteren Systemen
  build-linux-x64:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    steps:
      - name: Install git (base image ships without)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc patchelf ccache binutils
          rm -rf /var/lib/apt/lists/*
          python -m pip install --upgrade pip
          pip install nuitka zstandard

      - name: Install project
        run: |
          pip install .

      - name: "Build onefile (installer asset name: toolbox-linux-x64)"
        run: |
          python -m nuitka --onefile --assume-yes-for-downloads --include-package=toolboxv2 --include-package-data=toolboxv2 --output-filename=toolbox-linux-x64 --output-dir=build toolboxv2/__main__.py

      - name: Smoke test (no TTY in CI, R2 TTY-Fallback required)
        run: |
          chmod +x build/toolbox-linux-x64
          ./build/toolbox-linux-x64 --version
          ./build/toolbox-linux-x64 -l
          ./build/toolbox-linux-x64 --test || echo 'WARN: --test rc!=0 (expected R4 clear-error without tb-registry)'

      - name: GLIBC hard check (must be <= 2.31)
        run: |
          objdump -T build/toolbox-linux-x64 | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n 1
          objdump -T build/toolbox-linux-x64 | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n 1 | grep -qE 'GLIBC_2\.([0-9]|1[0-9]|2[0-9]|3[01])$' && echo 'GLIBC OK <= 2.31' || { echo 'FAIL: GLIBC > 2.31, binary would not run on older systems'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-linux-x64
          path: build/toolbox-linux-x64

      # Tag-Release (v0.1.28 etc.) — Asset ans Release des Tags haengen
      - name: Attach to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/toolbox-linux-x64

      # Nightly aus jedem master-Push — fortlaufender prerelease-Tag
      - name: Update nightly prerelease
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          make_latest: false
          files: build/toolbox-linux-x64

  # Windows onefile
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "Build onefile (installer asset name: toolbox-windows-x64.exe)"
        run: python -m nuitka --onefile --assume-yes-for-downloads --include-package=toolboxv2 --include-package-data=toolboxv2 --output-filename=toolbox-windows-x64.exe --output-dir=build toolboxv2/__main__.py

      - name: Smoke test
        run: .\build\toolbox-windows-x64.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-windows-x64
          path: build/toolbox-windows-x64.exe

      - name: Attach to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/toolbox-windows-x64.exe

  # macOS onefile (macos-latest = arm64)
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "Build onefile (installer asset name: toolbox-macos-arm64)"
        run: python -m nuitka --onefile --assume-yes-for-downloads --include-package=toolboxv2 --include-package-data=toolboxv2 --output-filename=toolbox-macos-arm64 --output-dir=build toolboxv2/__main__.py

      - name: Smoke test
        run: |
          chmod +x build/toolbox-macos-arm64
          ./build/toolbox-macos-arm64 --version

      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-macos-arm64
          path: build/toolbox-macos-arm64

      - name: Attach to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/toolbox-macos-arm64

  # ============================================================================
  # FLAG-EVAL (ALT github.event.release.tag_name -> NEU GITHUB_REF_TYPE/ref_name)
  # ============================================================================

  check-flags:
    name: Evaluate Tag Flags
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.eval.outputs.is_tag }}
      build_tauri: ${{ steps.eval.outputs.build_tauri }}
      build_tblang: ${{ steps.eval.outputs.build_tblang }}
    steps:
      - name: Evaluate ref
        id: eval
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] && [[ "$ref" == *"app"* ]]; then
            echo "build_tauri=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_tauri=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] && [[ "$ref" == *"tbx"* || "$ref" == *"TBX"* ]]; then
            echo "build_tblang=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_tblang=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # FRONTEND BUILD (jeder Tag; Vorlauf-Job fuer Tauri/Mobile)
  # ============================================================================

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [check-flags]
    if: needs.check-flags.outputs.is_tag == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and Build
        working-directory: toolboxv2
        run: |
          npm install
          npm install --prefix ./tbjs
          npm install --prefix ./web
          npm run build:tbjs && npm run build:web

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: toolboxv2/dist

  # ============================================================================
  # TBLANG COMPILER (Opt-in: "tbx" im Tag)
  # ============================================================================

  build-tblang:
    name: TBLang (${{ matrix.os }})
    needs: [check-flags]
    if: needs.check-flags.outputs.build_tblang == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tblang-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tblang-windows-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tblang-macos-arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build TBLang
        working-directory: ./toolboxv2/tb-exc/src
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Artifact
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            find ./toolboxv2/tb-exc/src/target/${{ matrix.target }}/release -maxdepth 1 -name "*.exe" -type f | head -1 | xargs -I {} cp {} artifacts/${{ matrix.artifact_name }}
          else
            find ./toolboxv2/tb-exc/src/target/${{ matrix.target }}/release -maxdepth 1 -type f -perm +111 ! -name "*.d" | head -1 | xargs -I {} cp {} artifacts/${{ matrix.artifact_name }} || true
            chmod +x artifacts/${{ matrix.artifact_name }} 2>/dev/null || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*

  # ============================================================================
  # BROWSER EXTENSION (jeder Tag, Auto-Detect ob tb_browser existiert)
  # ============================================================================

  build-browser-extension:
    name: Browser Extension
    runs-on: ubuntu-latest
    needs: [check-flags]
    if: needs.check-flags.outputs.is_tag == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Extension
        id: check
        run: |
          if [ -f "./toolboxv2/tb_browser/build.js" ] || [ -d "./toolboxv2/tb_browser" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Extension
        if: steps.check.outputs.exists == 'true'
        working-directory: ./toolboxv2/tb_browser
        run: |
          npm install || true
          if [ -f "build.js" ]; then
            node build.js zip
          elif [ -f "package.json" ]; then
            npm run build || true
          fi

      - name: Package Extension
        if: steps.check.outputs.exists == 'true'
        run: |
          mkdir -p artifacts
          cd ./toolboxv2/tb_browser
          if [ -d "dist" ]; then
            zip -r ../../artifacts/tb-browser-extension.zip dist/
          elif [ -d "build" ]; then
            zip -r ../../artifacts/tb-browser-extension.zip build/
          fi

      - name: Upload Artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: artifacts/*

  # ============================================================================
  # TAURI DESKTOP (Opt-in: "app" im Tag; braucht Frontend)
  # ============================================================================

  build-tauri:
    name: Tauri (${{ matrix.platform }})
    needs: [check-flags, build-frontend]
    if: needs.check-flags.outputs.build_tauri == 'true'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            artifact_name: simple-core-macos-arm64
            target_triple: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            artifact_name: simple-core-macos-x64
            target_triple: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            artifact_name: simple-core-linux-x64
            target_triple: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ''
            artifact_name: simple-core-windows-x64
            target_triple: x86_64-pc-windows-msvc
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Ubuntu Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create Worker Binary
        shell: bash
        run: |
          mkdir -p ./toolboxv2/simple-core/src-tauri/binaries

          # Install ToolBoxV2 and PyInstaller
          pip install pyinstaller
          pip install -e . || pip install .

          # Use the real tauri_integration.py as entry point
          WORKER_ENTRY="./toolboxv2/utils/workers/tauri_integration.py"

          # Build with PyInstaller including all ToolBoxV2 dependencies
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pyinstaller --onefile \
              --name "tb-worker-${{ matrix.target_triple }}" \
              --console \
              --collect-all toolboxv2 \
              --hidden-import toolboxv2.utils.workers \
              --hidden-import toolboxv2.utils.workers.server_worker \
              --hidden-import toolboxv2.utils.workers.ws_worker \
              --hidden-import toolboxv2.utils.workers.config \
              --hidden-import toolboxv2.utils.workers.session \
              --hidden-import toolboxv2.utils.workers.event_manager \
              --hidden-import toolboxv2.utils.system.getting_and_closing_app \
              "$WORKER_ENTRY"
            cp dist/tb-worker-${{ matrix.target_triple }}.exe ./toolboxv2/simple-core/src-tauri/binaries/
          else
            pyinstaller --onefile \
              --name "tb-worker-${{ matrix.target_triple }}" \
              --collect-all toolboxv2 \
              --hidden-import toolboxv2.utils.workers \
              --hidden-import toolboxv2.utils.workers.server_worker \
              --hidden-import toolboxv2.utils.workers.ws_worker \
              --hidden-import toolboxv2.utils.workers.config \
              --hidden-import toolboxv2.utils.workers.session \
              --hidden-import toolboxv2.utils.workers.event_manager \
              --hidden-import toolboxv2.utils.system.getting_and_closing_app \
              "$WORKER_ENTRY"
            cp dist/tb-worker-${{ matrix.target_triple }} ./toolboxv2/simple-core/src-tauri/binaries/
            chmod +x ./toolboxv2/simple-core/src-tauri/binaries/tb-worker-${{ matrix.target_triple }}
          fi

          # Verify the binary was created
          ls -la ./toolboxv2/simple-core/src-tauri/binaries/

      - name: Update Cargo Dependencies
        working-directory: ./toolboxv2/simple-core/src-tauri
        run: cargo update

      - name: Install Frontend Dependencies
        working-directory: ./toolboxv2
        run: |
          npm install
          npm install --prefix ./web
          cd simple-core && npm install && cd ..
          npm run build

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./toolboxv2/simple-core
          tauriScript: npx tauri
          args: ${{ matrix.args }}

      - name: Package Artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find ./toolboxv2/simple-core/src-tauri/target -name "*.dmg" -exec cp {} artifacts/ \; 2>/dev/null || true
          find ./toolboxv2/simple-core/src-tauri/target -name "*.msi" -exec cp {} artifacts/ \; 2>/dev/null || true
          find ./toolboxv2/simple-core/src-tauri/target -name "*.deb" -exec cp {} artifacts/ \; 2>/dev/null || true
          find ./toolboxv2/simple-core/src-tauri/target -name "*.AppImage" -exec cp {} artifacts/ \; 2>/dev/null || true
          find ./toolboxv2/simple-core/src-tauri/target -name "*.app.tar.gz" -exec cp {} artifacts/ \; 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*

  # ============================================================================
  # ANDROID APK (Opt-in: "app" im Tag)
  # ============================================================================

  build-android:
    name: Android APK
    needs: [check-flags, build-frontend]
    if: needs.check-flags.outputs.build_tauri == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Update Cargo Dependencies
        working-directory: ./toolboxv2/simple-core/src-tauri
        run: cargo update

      - name: Install Frontend Dependencies
        working-directory: ./toolboxv2
        run: |
          npm install
          npm install --prefix ./web
          cd simple-core && npm install && cd ..
          npm run build

      - name: Remove externalBin for Mobile
        working-directory: ./toolboxv2/simple-core/src-tauri
        run: |
          python3 -c "
          import json
          with open('tauri.conf.json', 'r') as f:
              config = json.load(f)
          if 'bundle' in config and 'externalBin' in config['bundle']:
              del config['bundle']['externalBin']
          with open('tauri.conf.json', 'w') as f:
              json.dump(config, f, indent=2)
          "

      - name: Clean Android Build Cache
        working-directory: ./toolboxv2/simple-core/src-tauri
        run: |
          rm -rf gen/android
          rm -rf target/aarch64-linux-android
          rm -rf target/armv7-linux-androideabi
          rm -rf target/x86_64-linux-android
          rm -rf target/i686-linux-android

      - name: Build Android
        working-directory: ./toolboxv2/simple-core
        run: |
          cargo tauri android init
          cargo tauri android build --apk || cargo tauri android build

      - name: Package Artifacts
        run: |
          mkdir -p artifacts
          find ./toolboxv2/simple-core -name "*.apk" -exec cp {} artifacts/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk

  # ============================================================================
  # iOS (Opt-in: "app" im Tag)
  # ============================================================================

  build-ios:
    name: iOS Build
    needs: [check-flags, build-frontend]
    if: needs.check-flags.outputs.build_tauri == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Update Cargo Dependencies
        working-directory: ./toolboxv2/simple-core/src-tauri
        run: cargo update

      - name: Install Frontend Dependencies
        working-directory: ./toolboxv2
        run: |
          npm install
          npm install --prefix ./web
          cd simple-core && npm install && cd ..
          npm run build

      - name: Remove externalBin for Mobile
        working-directory: ./toolboxv2/simple-core/src-tauri
        run: |
          python3 -c "
          import json
          with open('tauri.conf.json', 'r') as f:
              config = json.load(f)
          if 'bundle' in config and 'externalBin' in config['bundle']:
              del config['bundle']['externalBin']
          with open('tauri.conf.json', 'w') as f:
              json.dump(config, f, indent=2)
          "

      - name: Clean iOS Build Cache
        working-directory: ./toolboxv2/simple-core/src-tauri
        run: |
          rm -rf gen/apple
          rm -rf target/aarch64-apple-ios
          rm -rf target/x86_64-apple-ios
          rm -rf target/aarch64-apple-ios-sim

      - name: Build iOS
        working-directory: ./toolboxv2/simple-core
        run: |
          cargo tauri ios init
          cargo tauri ios build --debug || true

      - name: Package Artifacts
        run: |
          mkdir -p artifacts
          find ./toolboxv2/simple-core -name "*.app" -type d -exec zip -r artifacts/ios-app.zip {} \; 2>/dev/null || true
          find ./toolboxv2/simple-core -name "*.ipa" -exec cp {} artifacts/ \; 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: artifacts/*

  # ============================================================================
  # PYTHON WHEEL (jeder Tag; NICHT publishen — PyPI laeuft separat!)
  # ============================================================================

  build-python:
    name: Build Python Distribution
    runs-on: ubuntu-latest
    needs: [check-flags]
    if: needs.check-flags.outputs.is_tag == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Build Dependencies + ToolBoxV2 (editable for tb CLI)
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pyyaml
          pip install -e .

      # Feature Packing + Wheel via tb build (kein Publish — separat!)
      - name: Pack Features + Build Wheel via tb build
        run: |
          echo "=== Packing Features + Building Wheel via tb build ==="
          tb build build

          echo ""
          echo "=== Contents of features_packed/ ==="
          ls -la toolboxv2/features_packed/ || true

          echo ""
          echo "=== Built Packages ==="
          ls -la dist/

      - name: Verify Package Contents
        run: |
          echo "=== Verifying Package includes Feature ZIPs ==="

          WHEEL=$(ls dist/*.whl | head -1)
          echo "Checking wheel: $WHEEL"
          python -m zipfile -l "$WHEEL" | grep -E "(features_packed|\.zip)" || echo "Warning: No feature ZIPs found in wheel"

          TAR=$(ls dist/*.tar.gz | head -1)
          echo "Checking tarball: $TAR"
          tar -tzf "$TAR" | grep -E "(features_packed|\.zip)" || echo "Warning: No feature ZIPs found in tarball"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.tar.gz
            dist/*.whl

  # ============================================================================
  # INSTALLERS (installer.sh + Termux, jeder Tag)
  # ============================================================================

  build-installers:
    name: Build Installers
    runs-on: ubuntu-latest
    needs: [check-flags]
    if: needs.check-flags.outputs.is_tag == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Installers
        run: |
          mkdir -p artifacts

          cp installer.sh artifacts/installer.sh
          chmod +x artifacts/installer.sh

          mkdir -p artifacts/termux

          cat > artifacts/termux/install-toolboxv2.sh << 'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          set -e
          echo "=============================================="
          echo "         ToolBoxV2 - Termux Installer"
          echo "=============================================="
          RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[1;33m'; NC='\033[0m'
          if [ ! -d "/data/data/com.termux" ]; then
              echo -e "${RED}Error: Run this in Termux!${NC}"; exit 1
          fi
          echo -e "${YELLOW}[1/5] Updating packages...${NC}"
          pkg update -y && pkg upgrade -y
          echo -e "${YELLOW}[2/5] Installing dependencies...${NC}"
          pkg install -y python python-pip git clang make
          echo -e "${YELLOW}[3/5] Installing Python packages...${NC}"
          pip install --upgrade pip wheel setuptools
          echo -e "${YELLOW}[4/5] Installing ToolBoxV2...${NC}"
          pip install ToolBoxV2 || pip install git+https://github.com/MarkinHaus/ToolBoxV2.git
          echo -e "${YELLOW}[5/5] Initializing...${NC}"
          tb -init main || python -m toolboxv2 -init main || true
          echo -e "${GREEN}Installation complete! Run: tb${NC}"
          EOF

          cat > artifacts/termux/toolboxv2-boot.sh << 'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          termux-wake-lock
          tb workers start || python -m toolboxv2 workers start
          EOF

          chmod +x artifacts/termux/*.sh
          cd artifacts/termux && tar -czvf ../termux-toolboxv2-installer.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            artifacts/installer.sh
            artifacts/termux-toolboxv2-installer.tar.gz
            artifacts/termux/*.sh

  # ============================================================================
  # DOCKER (jeder Tag) — Build & Push to GHCR
  # ============================================================================

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [check-flags, build-python]
    if: needs.check-flags.outputs.is_tag == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name for image
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Single full-featured image (all features via pip install .[all])
      - name: Build and Push (full)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.toolbox
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build SSH Variant
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ssh
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:ssh
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}-ssh
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.repo.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # SAMMEL-UPLOAD fuer Flag-Assets (nur Tags, nie Nightly)
  # ASSET-STRATEGIE (Empfehlung):
  #   - Kern-Binaries (toolbox-*) -> pro-Job attach (NEU-Muster, Nightly-kompatibel)
  #   - Flag-Assets -> dieser eine Sammel-Job (skipped jobs erzeugen keine
  #     Artefakte, pattern matched dann einfach nichts)
  # ============================================================================

  upload-optional-assets:
    name: Upload Optional (Flag) Assets
    runs-on: ubuntu-latest
    needs:
      - check-flags
      - build-frontend
      - build-tblang
      - build-browser-extension
      - build-python
      - build-installers
      - build-tauri
      - build-android
      - build-ios
      - build-docker
    if: always() && needs.check-flags.outputs.is_tag == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: '{frontend-dist,tblang-*,browser-extension,python-dist,installers,simple-core-*,android-apk,ios-build}'
          merge-multiple: true

      - name: List Artifacts
        run: find all-artifacts -type f | head -50 || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/**
