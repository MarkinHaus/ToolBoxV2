name: Nightly Release

# P1 Phase 2 (architecture.md): Nightly-Tag mit ueberschreibbaren Artefakten.
# Kaltstart-Installer brauchen downloadbare Binaries ohne echten Release.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true

  nightly:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            target_triple: x86_64-pc-windows-msvc
          - os: macos-latest
            target_triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps (webkit2gtk)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Fetch uv sidecar (bundle.externalBin binaries/uv)
        shell: bash
        run: bash scripts/fetch_uv_sidecar.sh "${{ matrix.target_triple }}"

      - name: Run Rust unit tests (Linux only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./toolboxv2/simple-core/src-tauri
        run: cargo test --lib

      - name: Install frontend dependencies
        working-directory: ./toolboxv2
        run: |
          npm install
          npm install --prefix ./web
          npm install --prefix ./simple-core
          npm run build

      - name: Build Tauri (nightly)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./toolboxv2/simple-core
          tauriScript: npx tauri
          tagName: nightly
          releaseName: 'Nightly Build'
          releaseBody: 'Automated nightly — P1 cold-start installer binaries (0.1.x-dev)'
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
