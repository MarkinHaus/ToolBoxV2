# ============================================================================
# ToolBoxV2 Compose — nginx reverse proxy
# ============================================================================

upstream tb_workers {
    # docker compose DNS resolves 'tb-worker' to all scaled instances
    server tb-worker:8000;
    keepalive 32;
}

upstream tb_ws {
    server tb-worker:8468;
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;

server {
    # ponytail: keine ENV-Substitution — nginx envsubst nur templates/*.template, gemountete .conf bricht mit [emerg].
    # Upgrade: docker/nginx/default.conf.template + templates-mount, falls hostbasierte vhosts gebraucht werden.
    listen 80 default_server;
    server_name _;

    # -- Gzip ----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain text/html;

    # -- Security headers ----------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 50M;

    # -- Health (no rate limit) ----------------------------------------------
    # ponytail: /health lokal statt proxy — nginx-Healthcheck muss auch gruen sein,
    # wenn tb-worker down/starting ist (sonst unhealthy-Spirale im Compose).
    location /health {
        access_log off;
        return 200 "nginx-ok\n";
    }

    # -- WebSocket endpoint --------------------------------------------------
    location /ws {
        limit_req zone=ws_limit burst=20 nodelay;

        proxy_pass http://tb_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -- API -----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://tb_workers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -- LLM Gateway (proxied if running) -------------------------------------
    # ponytail: optionale Profile-Services (llm/registry) existieren nicht immer —
    # statischer upstream => [emerg] host not found beim Start => Restart-Loop.
    # Variable + Docker-Resolver = Lazy-Resolution zur Request-Zeit (502 wenn Service fehlt).
    location /llm/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $llm_up http://tb-llm-gateway:4000;
        rewrite ^/llm/(.*)$ /$1 break;
        proxy_pass $llm_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # -- Registry (proxied if running) ----------------------------------------
    location /registry/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $registry_up http://tb-registry:4025;
        rewrite ^/registry/(.*)$ /$1 break;
        proxy_pass $registry_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        client_max_body_size 100M;
    }

    # -- Container proxy locations (loaded dynamically) ----------------------
    include /etc/nginx/box-enabled/*.conf;

    # -- Static / catch-all --------------------------------------------------
    # Compose-Mode: dist wird direkt von nginx geservt (Volume ./toolboxv2/dist/web),
    # API/WS/Health bleiben proxied an tb-worker. UI laedt auch wenn Worker down ist.
    # ponytail: dist via Bind-Mount (Repo-Checkout noetig); Upgrade: COPY ins Image fuer reine Deploy-Hosts.
    location / {
        root /usr/share/nginx/html/tb;
        gzip_static on;
        try_files $uri /core0/index.html;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
